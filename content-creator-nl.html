<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Stamp Scanner — NL</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:32px auto;padding:0 16px;background:#f6f7f9}.post{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.text{white-space:pre-wrap}.meta,.count{font-size:13px;color:#666}button{padding:9px 13px}</style></head><body><h1>AI Stamp Collection Scanner</h1><p>50 Nederlandse Threads-posts. Browser Beta. 🤖 Vertaald met AI; taalfeedback welkom.</p><div id="posts"></div><script>const URL='https://bit.ly/AIStampScannerApp',AI='🤖 Vertaald met AI — taalfout gezien? Stuur me een DM.';const raw=[
['Inventaris','Maak overzicht van dozen en albums vol postzegels.\n\nZet foto’s om in een gestructureerde inventaris die je kunt controleren en aanpassen.'],['Inventaris','Begin niet met handmatig een spreadsheet vullen.\n\nUpload foto’s, laat de scanner structuur maken, controleer en exporteer.'],['Inventaris','Begin bij een grote verzameling met overzicht.\n\nBepaal niet meteen de waarde en probeer niet alles direct perfect te identificeren.'],['Inventaris','Een postzegelverzameling geërfd? Vraag eerst: wat zit erin?\n\nMaak overzicht vóór je naar waarde kijkt.'],['Inventaris','Gebruik AI als hulpmiddel, niet als zekerheid.\n\nLaat de Beta vooral helpen met structureren, controleren en exporteren.'],['Inventaris','Maak je album doorzoekbaar.\n\nEen digitale inventaris helpt sneller terugvinden wat je bezit.'],
['Foto’s','Leg losse postzegels naast elkaar zonder overlap.\n\nHoud iedere zegel zoveel mogelijk volledig zichtbaar.'],['Foto’s','Maak betere bronfoto’s:\n📷 recht van boven\n💡 voldoende licht\n🔍 scherp\n↔️ geen overlap'],['Foto’s','Geef de scanner een duidelijke foto.\n\nDonker, onscherp en overlappend blijft ook voor AI moeilijk.'],['Onderzoek','Maak eerst een inventaris.\n\nOnderzoek daarna gericht welke zegels verder aandacht verdienen.'],['Onderzoek','Gebruik de inventaris niet als waardebepaling.\n\nStaat, variant, echtheid en markt kunnen de waarde beïnvloeden.'],['Beta','Controleer wat AI voorstelt.\n\n“AI” betekent niet “altijd correct”. Pas de inventaris aan vóór je exporteert.'],['Beta','Test zonder installatie.\n\nVoeg foto’s toe → controleer de inventaris → exporteer.'],['Export','Maak de inventaris in de Browser Beta.\n\nExporteer daarna naar Excel of CSV. Excel is een exportformaat, niet de app.'],['Export','Gebruik het fotonummer om ieder record terug te vinden op de juiste bronfoto.'],['Export','Verwacht geen ingebedde foto’s in Excel.\n\nDe Browser Beta houdt de koppeling met de bronfoto tekstueel zichtbaar.'],['Inventaris','Laat de scanner eerst structuur maken.\n\nOok zonder ieder detail te kennen kan een doorzoekbare inventaris veel handwerk besparen.'],['Foto’s','Zet meerdere postzegels goed zichtbaar naast elkaar.\n\nVermijd stapels en overlap.'],['Onderzoek','Zie “interessant” als reden voor onderzoek, niet als bewijs van zeldzaamheid of waarde.'],['Beta','Test met echte verzamelingen.\n\nOok moeilijke foto’s en verschillende albums laten zien waar de scanner beter moet worden.'],
['Beta','Meld juist waar de scanner faalt.\n\nTe weinig zegels gevonden? Verkeerde structuur? Onduidelijke foto? Die feedback helpt.'],['Beta','Test ook een drukke albumbladzijde met veel kleine zegels.\n\nMoeilijk materiaal laat zien waar detectie beter moet.'],['Beta','Gebruik de scanner zonder technische voorkennis.\n\nLoop je vast? Meld waar. Dat is waardevolle Beta-feedback.'],['Beta','Wat mis jij in een digitale postzegelscanner? Betere herkenning, meer onderzoekslinks, uitgebreidere export of iets anders?'],['Beta','Test met verschillende verzamelingen.\n\nAlbums, dozen en losse zegels vragen niet altijd om dezelfde aanpak.'],['Inventaris','Digitaliseer je verzameling voor later.\n\nBewaar, doorzoek en vul je overzicht aan wanneer dat nodig is.'],['Foto’s','Begin met een paar duidelijke foto’s.\n\nLeer eerst de workflow. Probeer daarna moeilijkere albumbladen.'],['Foto’s','Nummer je foto’s.\n\n“Foto 12” terugvinden is makkelijker dan onthouden waar een zegel stond.'],['Onderzoek','Zie een digitale inventaris niet als taxatierapport.\n\nGebruik hem om te organiseren en verder onderzoek voor te bereiden.'],['Onderzoek','Houd rekening met grenzen van fotoherkenning.\n\nPerforaties, watermerken, drukvarianten, kleur en conditie kunnen belangrijk zijn.'],['Export','Gebruik CSV wanneer je de inventaris later eenvoudig in andere software wilt verwerken.'],['Foto’s','Maak geen studiofoto, maar wel een bruikbare foto.\n\nHoud de zegel scherp, goed belicht, zichtbaar en zonder overlap.'],['Foto’s','Test ook pagina’s met bijna identieke zegels.\n\nJuist zulke moeilijke pagina’s helpen automatische detectie verbeteren.'],['Beta','Test niet alleen perfecte voorbeeldfoto’s.\n\nGebruik ook een realistische foto uit je eigen verzameling.'],['Beta','Fout gevonden? Pas de inventaris aan vóór export.\n\nAI doet een voorstel. Jij houdt de controle.'],['Inventaris','Laat de scanner een eerste structuur maken.\n\nControleer en verbeter die daarna in plaats van ieder veld vanaf nul in te vullen.'],['Inventaris','Maak je verzameling toegankelijker zonder je albums te veranderen.\n\nGebruik een digitale inventaris als extra overzicht.'],['Inventaris','Denk je ooit aan verkoop? Maak eerst een gestructureerd overzicht.\n\nDat zegt meer dan: “Er staan een paar albums op zolder.”'],['Onderzoek','Geen verzamelaar maar wel een verzameling geërfd?\n\nMaak eerst overzicht. Onderzoek opvallende items. Vraag bij twijfel een specialist.'],['Onderzoek','Verbind fysieke albums met online onderzoek.\n\nGebruik een digitale inventaris als brug tussen beide.'],
['Beta','Vertel wat de volgende versie beter moet doen.\n\nEchte verzamelaars laten zien welke problemen werkelijk belangrijk zijn.'],['Beta','Test of de bediening vanzelf spreekt.\n\nMoet je raden wat je moet doen? Dan moet de interface duidelijker.'],['Beta','Houd feedback kort als je wilt.\n\n“Deze foto vond 6 van mijn 12 zegels” is al nuttige informatie.'],['Foto’s','Test eerst een makkelijke foto en daarna een moeilijke.\n\nVergelijk waar de detectie sterk en kwetsbaar is.'],['Onderzoek','Zie je mogelijk een bijzondere postzegel? Onderzoek hem verder.\n\nControleer betrouwbare bronnen of vraag een deskundige. AI is geen bewijs.'],['Beta','Test eerst een eenvoudige Browser Beta met echte verzamelingen.\n\nMaak hem pas complexer als duidelijk is wat nuttig is.'],['Beta','Laat de tool niet meer zekerheid geven dan verantwoord is.\n\nBlijf voorzichtig met uitspraken over waarde en echtheid.'],['Inventaris','Houd de rollen duidelijk: de postzegel is de bron, de foto en AI zijn hulpmiddelen, de inventaris geeft overzicht.'],['Beta','Als jij één functie mocht toevoegen aan AI Stamp Collection Scanner, welke zou dat zijn?'],['Beta','Gebruik de Browser Beta om te ontdekken wat verzamelaars echt nodig hebben.\n\nTest met je eigen postzegels en deel je feedback.']];function compose(p){return `${p[1]}\n\nProbeer de Browser Beta 👇\n${URL}\n\n${AI}`};const posts=raw.map((p,i)=>({id:`STAMP-${String(i+1).padStart(3,'0')}-nl`,theme:p[0],text:compose(p)}));const root=document.getElementById('posts');posts.forEach(p=>{const e=document.createElement('article');e.className='post';e.innerHTML=`<div class="meta">${p.id} · ${p.theme}</div><div class="text"></div><div class="count">${p.text.length}/500</div><button>Kopiëren</button>`;e.querySelector('.text').textContent=p.text;e.querySelector('button').onclick=()=>navigator.clipboard.writeText(p.text);root.appendChild(e)});if(posts.length!==50||posts.some(p=>p.text.length>500)||posts.some(p=>!p.text.includes('Vertaald met AI')))throw Error('Content QA failed');</script></body></html>
