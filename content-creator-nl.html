<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Stamp Collection Scanner — Nederlandse Content Creator</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:32px auto;padding:0 16px;background:#f6f7f9;color:#171717}h1{margin-bottom:4px}.note{color:#555}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{padding:9px 13px;border:1px solid #bbb;border-radius:8px;background:white;cursor:pointer}.post{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.meta{font-size:13px;color:#666;margin-bottom:8px}.text{white-space:pre-wrap}.count{font-size:12px;color:#666;margin-top:8px}.over{color:#b00020;font-weight:700}</style></head><body><h1>AI Stamp Collection Scanner</h1><p class="note">Nederlandse Threads-content — 50 posts. Browser Beta. 🤖 Vertaald met AI; taalfeedback is welkom.</p><div class="toolbar"><button onclick="copyAll()">Alles kopiëren</button><button onclick="downloadCsv()">CSV downloaden</button></div><div id="posts"></div><script>
const URL='https://bit.ly/AIStampScannerApp';const AI='🤖 Vertaald met AI — taalfout gezien? Stuur me een DM.';
const raw=[
['Inventaris','Heb je dozen of albums vol postzegels, maar geen duidelijk overzicht?\n\nAI Stamp Collection Scanner helpt foto’s om te zetten in een gestructureerde postzegelinventaris die je zelf kunt controleren en aanpassen.'],['Inventaris','Een postzegelverzameling inventariseren hoeft niet te beginnen met een spreadsheet vol handwerk.\n\nUpload foto’s, laat de scanner helpen structureren, controleer en exporteer.'],['Inventaris','Honderden postzegels. Waar begin je?\n\nNiet met waarde bepalen. Niet met alles perfect identificeren. Begin met overzicht: maak eerst een bruikbare inventaris.'],['Inventaris','Een oude postzegelverzameling geërfd?\n\nDe eerste vraag hoeft niet te zijn “Wat is dit waard?” Een betere eerste stap: “Wat zit er eigenlijk allemaal in?”'],['Inventaris','AI kan helpen bij een postzegelverzameling, maar niet door te doen alsof iedere zegel met zekerheid wordt herkend.\n\nDeze Beta helpt vooral structureren, controleren en exporteren.'],['Inventaris','Een postzegelalbum is geweldig om doorheen te bladeren. Minder handig als je snel wilt weten wat je bezit.\n\nEen digitale inventaris maakt zoeken en onderzoek makkelijker.'],
['Foto’s','Foto’s van je postzegels maken? Leg losse zegels bij voorkeur naast elkaar zonder overlap.\n\nAls een deel verborgen is, kan de scanner minder goed bepalen wat er op de foto staat.'],['Foto’s','Een simpele fototip voor postzegels:\n📷 recht van boven\n💡 voldoende licht\n🔍 scherp beeld\n↔️ geen overlappende losse zegels\n\nBetere bronfoto’s geven meer bruikbare informatie.'],['Foto’s','AI-herkenning is geen magie. Een donkere, onscherpe foto met overlappende postzegels blijft moeilijk.\n\nGoede invoer helpt.'],['Onderzoek','Waarom eerst een postzegelinventaris maken?\n\nOmdat onderzoek makkelijker wordt wanneer je weet welke zegels je hebt, op welke foto ze staan en welke verder onderzoek verdienen.'],['Onderzoek','De Browser Beta bepaalt niet automatisch wat je postzegels waard zijn.\n\nWaarde kan afhangen van staat, variant, echtheid en markt. De inventaris is het startpunt.'],['Beta','“AI” betekent niet “altijd correct”.\n\nDaarom kun je de gemaakte postzegelinventaris zelf controleren en aanpassen voordat je hem exporteert.'],['Beta','Je hoeft geen software te installeren om de Browser Beta te testen.\n\nFoto’s toevoegen → inventaris controleren → exporteren. Eenvoud is onderdeel van het idee.'],['Export','Excel is bij AI Stamp Collection Scanner een exportformaat, niet de app zelf.\n\nMaak de inventaris in de Browser Beta en exporteer daarna naar Excel of CSV.'],['Export','Waarom staat er een fotonummer bij een postzegelrecord?\n\nOmdat je later wilt kunnen terugvinden uit welke bronfoto een item kwam.'],['Export','De Excel-export bevat geen ingebedde foto’s.\n\nIn deze eenvoudige Browser Beta blijft de koppeling met de bronfoto tekstueel zichtbaar.'],['Inventaris','Een scanner hoeft niet meteen alles over een postzegel te weten om nuttig te zijn.\n\nEen grote verzameling omzetten naar een doorzoekbare inventaris kan al veel handwerk overzichtelijker maken.'],['Foto’s','Heb je meerdere postzegels op één foto? Zorg dat ze zo goed mogelijk zichtbaar zijn.\n\nLosse zegels naast elkaar werkt beter dan een stapeltje waarbij delen verdwijnen.'],['Onderzoek','Een postzegel kan interessant lijken. Maar “interessant” betekent nog niet automatisch zeldzaam of waardevol.\n\nGebruik zo’n aanwijzing vooral als reden voor verder onderzoek.'],['Beta','Browser Beta betekent: testen met echte verzamelingen.\n\nJuist moeilijke foto’s en verschillende soorten albums helpen ontdekken waar de scanner beter moet worden.'],
['Beta','Ik wil niet alleen weten wanneer de scanner goed werkt. Ik wil juist weten wanneer hij faalt.\n\nTe weinig zegels gevonden? Verkeerde structuur? Onduidelijke foto? Dat is waardevolle feedback.'],['Beta','Heb je een lastige postzegelpagina met veel kleine zegels dicht bij elkaar?\n\nDat is interessant testmateriaal. Moeilijke foto’s helpen de scanner beter te maken.'],['Beta','Een Beta-tester hoeft geen technische kennis te hebben.\n\nGebruik de scanner zoals jij denkt dat logisch is. Loop je vast? Dan is dat óók nuttige informatie.'],['Beta','Wat zou jij in een digitale postzegelscanner willen zien?\n\nBetere herkenning? Meer onderzoekslinks? Een uitgebreidere export? Beta-feedback helpt bepalen wat later belangrijk wordt.'],['Beta','Niet iedere verzamelaar werkt hetzelfde. De één heeft albums, de ander dozen of losse zegels.\n\nDaarom is testen met verschillende echte verzamelingen belangrijk.'],['Inventaris','Een verzameling digitaliseren is ook handig voor later.\n\nJe krijgt een overzicht dat je kunt bewaren, doorzoeken, aanvullen en gebruiken als startpunt voor onderzoek.'],['Foto’s','Begin niet meteen met je moeilijkste album.\n\nTest eerst een paar duidelijke foto’s. Zo leer je hoe de Browser Beta werkt voordat je ingewikkeldere pagina’s probeert.'],['Foto’s','Foto’s nummeren klinkt misschien ouderwets.\n\nMaar bij tientallen bronfoto’s is “Foto 12” een stuk makkelijker terugvinden dan proberen te onthouden waar een zegel stond.'],['Onderzoek','Een digitale inventaris is geen taxatierapport.\n\nDe scanner helpt organiseren en geeft aanknopingspunten voor verder onderzoek. Specialistische beoordeling blijft iets anders.'],['Onderzoek','Postzegels herkennen vanaf foto’s heeft grenzen.\n\nKleurverschillen, perforaties, watermerken, drukvarianten en conditie kunnen belangrijk zijn. Gebruik AI als hulpmiddel, niet als eindbeslissing.'],['Export','Waarom CSV naast Excel?\n\nOmdat een eenvoudige gegevensindeling handig kan zijn wanneer je de inventaris later in andere software wilt gebruiken.'],['Foto’s','Een goede postzegelfoto hoeft geen studiofoto te zijn.\n\nWel helpt het als de zegel scherp is, er voldoende licht is, belangrijke delen zichtbaar zijn en overlap wordt vermeden.'],['Foto’s','Heb je tien bijna identieke postzegels op één pagina?\n\nVoor een mens kan dat al lastig zijn. Voor automatische detectie ook. Juist zulke pagina’s zijn nuttig testmateriaal.'],['Beta','De beste Beta-test? Niet alleen een perfecte voorbeeldfoto gebruiken.\n\nProbeer ook een realistische foto van jouw eigen verzameling.'],['Beta','Een fout in de inventaris gevonden?\n\nDat is precies waarom controle vóór export belangrijk is. AI doet een voorstel. Jij houdt de controle.'],['Inventaris','Digitaliseren betekent niet dat je urenlang ieder veld zelf moet invullen.\n\nHet idee is een eerste structuur te maken die jij daarna kunt controleren en verbeteren.'],['Inventaris','Een postzegelverzameling kan tientallen jaren geschiedenis bevatten.\n\nEen digitale inventaris helpt die verzameling beter toegankelijk te maken zonder de albums zelf te veranderen.'],['Inventaris','Verkoop je ooit een verzameling?\n\nDan kan een gestructureerd overzicht nuttiger zijn dan alleen zeggen: “Er staan een paar albums op zolder.” Inventariseren komt eerst.'],['Onderzoek','Een verzameling geërfd maar zelf geen verzamelaar?\n\nMaak eerst overzicht. Onderzoek daarna opvallende items. Vraag bij twijfel een specialist. Niet alles hoeft tegelijk.'],['Onderzoek','Postzegels verzamelen is vaak analoog. Onderzoek hoeft dat niet volledig te blijven.\n\nEen digitale inventaris kan de brug zijn tussen fysieke albums en online bronnen.'],
['Beta','Wat moet de volgende versie beter doen?\n\nDat wil ik niet alleen zelf bedenken. Echte verzamelaars kunnen laten zien welke problemen er werkelijk toe doen.'],['Beta','Een feature kan technisch slim zijn en toch onhandig voelen.\n\nKon je zonder uitleg begrijpen wat je moest doen? Zo niet, dan moet het product duidelijker worden.'],['Beta','Beta-feedback hoeft geen lang rapport te zijn.\n\n“Deze foto vond maar 6 van mijn 12 zegels.” Dat ene zinnetje kan al bijzonder nuttig zijn.'],['Foto’s','Testtip: gebruik eerst een makkelijke foto. Daarna een moeilijke.\n\nHet verschil vertelt veel over waar automatische detectie sterk of juist kwetsbaar is.'],['Onderzoek','Zie je een mogelijke bijzondere postzegel? Gebruik dat als onderzoeksaanwijzing.\n\nControleer daarna betrouwbare bronnen of laat een deskundige meekijken. AI is niet het bewijs.'],['Beta','Waarom een Browser Beta?\n\nOmdat een eenvoudige versie sneller met echte verzamelingen getest kan worden. Eerst bewijzen wat nuttig is. Daarna pas complexer maken.'],['Beta','Een goede tool voor verzamelaars moet niet doen alsof hij meer weet dan hij weet.\n\nDaarom blijven controle en terughoudendheid rond waarde en echtheid belangrijk.'],['Inventaris','De fysieke postzegel blijft de bron. De foto is een hulpmiddel. De AI is een hulpmiddel. De inventaris is een hulpmiddel.\n\nSamen kunnen ze organiseren makkelijker maken.'],['Beta','Als jij één ding aan AI Stamp Collection Scanner mocht toevoegen, wat zou het zijn?\n\nDat is misschien waardevollere feedback dan alleen melden wat er vandaag fout gaat.'],['Beta','De Browser Beta is geen eindproduct.\n\nHet is de versie waarmee we ontdekken wat verzamelaars werkelijk nodig hebben. Heb je postzegels en wil je helpen testen?']
];
function compose(p){return `${p[1]}\n\nProbeer de Browser Beta 👇\n${URL}\n\n${AI}`};const posts=raw.map((p,i)=>({id:`STAMP-${String(i+1).padStart(3,'0')}-nl`,theme:p[0],text:compose(p)}));const root=document.getElementById('posts');posts.forEach(p=>{const el=document.createElement('article');el.className='post';el.innerHTML=`<div class="meta">${p.id} · ${p.theme}</div><div class="text"></div><div class="count ${p.text.length>500?'over':''}">${p.text.length}/500</div><button>Kopiëren</button>`;el.querySelector('.text').textContent=p.text;el.querySelector('button').onclick=()=>navigator.clipboard.writeText(p.text);root.appendChild(el)});function copyAll(){navigator.clipboard.writeText(posts.map(p=>`${p.id}\n${p.text}`).join('\n\n---\n\n'))}function downloadCsv(){const q=v=>'"'+String(v).replaceAll('"','""')+'"';const csv='\ufeff'+[['id','theme','text'],...posts.map(p=>[p.id,p.theme,p.text])].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ai-stamp-content-nl.csv';a.click()}if(posts.length!==50||posts.some(p=>p.text.length>500)||posts.some(p=>!p.text.includes('Vertaald met AI')))throw new Error('Content QA failed');
</script></body></html>
