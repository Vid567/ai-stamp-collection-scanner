<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14365e"><title>AI Stamp Scanner — Browser Beta v1.0</title><link rel="icon" href="assets/branding/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="scanner.css"><style>.app-header nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.app-header nav a{color:#14365e;font-weight:700;text-decoration:none}.ai-badge{display:inline-block;background:#eef5fb;border:1px solid #cbdceb;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:#14365e}.source-label{display:grid;gap:3px;font-size:11px;color:#607087}</style></head><body><header class="app-header"><a href="../beta-test-zh-cn.html" class="brand"><img src="assets/branding/logo-mark.svg" alt="">AI Stamp Collection Scanner</a><nav><a href="docs/zh-cn/quick-start.html">快速开始</a><a href="docs/zh-cn/user-guide.html">用户指南</a><a href="docs/zh-cn/faq.html">常见问题</a><a href="docs/zh-cn/troubleshooting.html">故障排除</a><span class="ai-badge">由 AI 翻译</span><span class="beta">Beta v1.0</span></nav></header><main><section class="intro"><p class="eyebrow">AI 辅助邮票清单</p><h1>为您的邮票收藏创建清晰的数字清单。</h1><p>上传收藏照片，创建结构化清单，编辑信息并保存。所有操作均在您的浏览器本地完成。</p><div class="privacy">🔒 照片保留在此浏览器中，不会上传。</div></section><section class="panel"><div class="section-head"><div><span>第 1 步</span><h2>选择邮票照片</h2></div><strong id="photo-count">0 张照片</strong></div><div class="upload-actions"><label class="button primary" for="photo-input">选择照片</label><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><label class="button secondary" for="camera-input">使用相机</label><input id="camera-input" type="file" accept="image/*" capture="environment" hidden><button class="button ghost" id="clear-all" type="button">全部清除</button></div><p class="help">支持 JPG、JPEG、PNG 和 WebP。每张接受的照片都会自动获得永久照片编号。</p><div id="messages"></div><div id="photo-grid" class="photo-grid"></div><button class="button primary wide" id="create-inventory" type="button" disabled>创建清单</button></section><section class="panel"><div class="section-head"><div><span>第 2–3 步</span><h2>检查并编辑清单</h2></div><strong id="row-count">0 条记录</strong></div><p class="help">所有字段均可编辑。请确认照片中的所有邮票都已列入清单。</p><div class="toolbar"><button class="button secondary" id="add-row" type="button" disabled>添加记录</button><button class="button primary" id="export-xlsx" type="button" disabled>保存为 Excel</button><button class="button secondary" id="export-csv" type="button" disabled>保存为 CSV</button></div><div id="empty-state" class="empty">请至少选择一张照片，然后点击“创建清单”。</div><div id="records" class="records"></div></section></main><template id="record-template"><article class="record-card"><div class="record-top"><div class="record-photo"></div><div><strong class="record-id"></strong><label class="source-label">来源照片<select class="record-photo-select" data-field="photoId"></select></label></div><div class="record-actions"><button data-action="duplicate">复制</button><button data-action="delete" class="danger">删除</button></div></div><div class="fields"></div></article></template><script src="vendor/xlsx.full.min.js"></script><script type="module" src="scanner-zh-cn.js"></script></body></html>
