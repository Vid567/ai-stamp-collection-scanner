<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Stamp Scanner — Content Creator</title><meta name="description" content="Plan, copy and track 25 English AI Stamp Collection Scanner marketing posts."><script async src="https://www.googletagmanager.com/gtag/js?id=G-MDGNZMY7BQ"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-MDGNZMY7BQ');</script><style>:root{--navy:#14365e;--blue:#245c91;--bg:#f7f9fc;--card:#fff;--ink:#172033;--muted:#5d6977;--line:#d8e2ec;--green:#176b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:auto}.top{background:var(--navy);color:#fff;padding:28px 0}.top h1{margin:0 0 5px}.top p{margin:0;opacity:.86}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select,.toolbar button{min-height:44px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff}.toolbar input{flex:1 1 220px}.toolbar button{cursor:pointer;font-weight:750;color:var(--navy)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:50px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.85rem}.post{white-space:pre-wrap;margin:12px 0;min-height:220px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions button,.actions select{min-height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 10px}.copy{background:var(--blue)!important;color:#fff!important;border:0!important;font-weight:800}.plan,.processed-btn{cursor:pointer}.processed{border-color:var(--green);box-shadow:0 0 0 2px #d1fae5}.processed .processed-btn{background:var(--green);color:#fff}.progress{display:flex;gap:10px;flex-wrap:wrap;margin:-10px 0 18px}.progress strong{background:#e7f2f8;color:var(--navy);padding:8px 11px;border-radius:9px;font-size:13px}.planner{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:50px}.planner h2{margin-top:0}.planner-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}@media(max-width:760px){.cards{grid-template-columns:1fr}.post{min-height:0}}</style></head><body><header class="top"><div class="wrap"><h1>📮 AI Stamp Scanner Content Creator</h1><p>25 English posts for the current Browser Beta positioning.</p></div></header><main class="wrap"><div class="toolbar"><select id="channel"><option value="bsky">Bluesky</option><option value="threads">Threads</option></select><input id="search" type="search" placeholder="Search posts"><select id="category"><option>All categories</option><option>Collection Problems</option><option>AI as an Assistant</option><option>Practical Tips</option><option>Conversation and Feedback</option></select></div><div class="progress"><strong id="processedCount"></strong><strong id="nextPost"></strong></div><section id="cards" class="cards"></section><section class="planner"><h2>Planner</h2><div id="planner"></div></section></main><script>const LINKS={bsky:'https://vid567.github.io/apps/?product=stamp',threads:'https://vid567.github.io/apps/?product=stamp'};const raw=[['Collection Problems','Inherited a stamp collection and not sure where to start?\n\nStart with an overview. Turn clear collection photos into an editable inventory you can review at your own pace.'],['Collection Problems','A stamp collection is easier to explore when you can see what is actually there.\n\nStart with photos, build an inventory and decide what you want to research next.'],['Collection Problems','Albums, stock books, envelopes and loose stamps can become one clearer overview.\n\nThe Browser Beta helps you build an editable stamp inventory from collection photos.'],['Collection Problems','You do not need to identify every stamp before you begin.\n\nCreate the inventory first. Research the interesting records afterwards.'],['Collection Problems','A folder full of stamp photos is useful.\n\nA structured inventory is easier to review, search and continue building.'],['Collection Problems','Collected for years but never made a full inventory?\n\nStart small. A few clear photos are enough to begin organizing what you have.'],['Collection Problems','Received a collection from someone else?\n\nA clear inventory gives you a practical first look before you decide what deserves more research.'],['AI as an Assistant','AI works best here as an assistant, not as the final authority.\n\nUse it to help create a first inventory, then review and edit the records yourself.'],['AI as an Assistant','The goal is not to guess a value for every stamp.\n\nThe goal is to organize the collection and make the next research step clearer.'],['AI as an Assistant','Good collection software should keep you in control.\n\nReview the generated records, correct details and add your own notes before exporting.'],['AI as an Assistant','Not every stamp needs deep research.\n\nAn organized inventory helps you focus attention on the stamps that raise useful questions.'],['AI as an Assistant','A useful result can be simple: a clear record, a photo reference and a note that something deserves a closer look.'],['AI as an Assistant','AI suggestions can help with the first pass.\n\nCatalogue checks and specialist knowledge still matter when exact identification is important.'],['Practical Tips','Photo tip: keep stamps fully visible whenever possible.\n\nOverlap hides details and makes recognition harder.'],['Practical Tips','Photo tip: use even light and keep the camera reasonably straight above the page.\n\nClearer photos give you better inventory records to review.'],['Practical Tips','Dense album page? Photograph smaller sections if individual stamps become too small to see clearly.'],['Practical Tips','Keep the original collection photos.\n\nThey remain useful when you want to check a detail again later.'],['Practical Tips','Start with a manageable batch of photos.\n\nBuild, review and export the inventory before moving on to the next part of the collection.'],['Practical Tips','Use the Browser Beta to organize first.\n\nThen use catalogues and reliable references for the records you want to investigate further.'],['Practical Tips','Your inventory is editable.\n\nIf a suggested detail is uncertain, correct it, leave it open or mark it for further research.'],['Conversation and Feedback','Stamp collectors: what takes the most time when you organize a collection?\n\nIdentifying stamps, keeping an inventory, finding duplicates or deciding what to research?'],['Conversation and Feedback','If you inherited a stamp collection, what was your first question?\n\nI am building this Browser Beta around the real first steps people actually need.'],['Conversation and Feedback','What would make a stamp inventory genuinely more useful to you?\n\nBetter photo handling, easier editing, stronger research support or richer exports?'],['Conversation and Feedback','I am testing AI Stamp Collection Scanner with real collection photos.\n\nThe aim is simple: make the first inventory easier without pretending AI knows everything.'],['Conversation and Feedback','Have a few stamps or an entire inherited collection?\n\nTry the Free Browser Beta and tell me which part of the workflow should be improved next.']];let plan=JSON.parse(localStorage.getItem('stampContentPlan')||'{}');let processed=JSON.parse(localStorage.getItem('stampContentProcessedV1')||'{}');function posts(){return raw.map((p,i)=>({id:`STAMP-${String(i+1).padStart(3,'0')}`,category:p[0],text:`${p[1]}\n\n🌍 Free Browser Beta\n${LINKS[channel.value]}\n\nDM me with your feedback.`}))}function render(){const q=search.value.toLowerCase(),cat=category.value;cards.innerHTML='';posts().filter(p=>(cat==='All categories'||p.category===cat)&&p.text.toLowerCase().includes(q)).forEach(p=>{const el=document.createElement('article');el.className=`card ${processed[p.id]?'processed':''}`;el.innerHTML=`<div class="meta"><b>${p.id}</b><span>${p.category}</span></div><div class="post"></div><div class="actions"><button class="copy">Copy</button><button class="plan">${plan[p.id]?'Change time':'Plan'}</button>${processed[p.id]?'<button class="processed-btn">✓ Processed</button>':''}</div>`;el.querySelector('.post').textContent=p.text;el.querySelector('.copy').onclick=async()=>{await navigator.clipboard.writeText(p.text);if(!processed[p.id]){processed[p.id]=new Date().toISOString();localStorage.setItem('stampContentProcessedV1',JSON.stringify(processed));render()}};el.querySelector('.plan').onclick=()=>planOne(p.id);const processedButton=el.querySelector('.processed-btn');if(processedButton)processedButton.onclick=()=>toggleProcessed(p.id);cards.appendChild(el)});renderProgress();renderPlanner()}function planOne(id){const value=prompt('Enter date and time (YYYY-MM-DD HH:MM)',plan[id]||'');if(!value)return;plan[id]=value;localStorage.setItem('stampContentPlan',JSON.stringify(plan));render()}function toggleProcessed(id){if(processed[id])delete processed[id];else processed[id]=new Date().toISOString();localStorage.setItem('stampContentProcessedV1',JSON.stringify(processed));render()}function renderProgress(){const list=posts(),done=list.filter(p=>processed[p.id]);processedCount.textContent=`${done.length} of ${list.length} processed`;const next=list.find(p=>!processed[p.id]);nextPost.textContent=next?`Next: ${next.id}`:'All posts processed ✓'}function renderPlanner(){const list=posts().filter(p=>plan[p.id]).sort((a,b)=>plan[a.id].localeCompare(plan[b.id]));planner.innerHTML=list.length?list.map(p=>`<div class="planner-row"><span>${plan[p.id]}</span><strong>${p.id}</strong></div>`).join(''):'No posts planned yet.'}channel.onchange=render;search.oninput=render;category.onchange=render;render();</script></body></html>
